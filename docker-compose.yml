services:
  agriculture_backend:
    build: ./agriculture_backend
    container_name: agriculture_backend
    restart: on-failure
    working_dir: /var/www/html
    volumes:
      - ./agriculture_backend:/var/www/html
      - ./agriculture_backend/php.ini:/usr/local/etc/php/conf.d/uploads.ini
    ports:
      - "8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - mysql
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: agriculture
      DB_USERNAME: yhaddar
      DB_PASSWORD: 3705

  agriculture_frontend:
    build: ./agriculture_frontend
    container_name: agriculture_frontend
    restart: always
    working_dir: /app
    volumes:
      - ./agriculture_frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host
    depends_on:
      - agriculture_backend
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agriculture_backend
      - agriculture_frontend

  mysql:
    image: mysql:latest
    container_name: mysql
    restart: always
    environment:
      MYSQL_DATABASE: agriculture
      MYSQL_ROOT_PASSWORD: 3705
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/conf.d/my.cnf:/etc/mysql/my.cnf
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "--host=localhost" ]
      interval: 10s
      retries: 5
      start_period: 5s
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_container
    restart: always
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "8080:80"
volumes:
  db_data: {}

